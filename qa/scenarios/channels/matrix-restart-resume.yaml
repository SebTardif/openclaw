title: Matrix lane resumes after Gateway restart

scenario:
  id: matrix-restart-resume
  surface: channels
  coverage:
    primary:
      - channels.resumed-final-reply
  objective: Verify channel delivery resumes after a Gateway restart without replaying completed delivery.
  successCriteria:
    - A reply is delivered before restart.
    - Restart does not replay the completed reply.
    - A fresh reply is delivered after restart.
  docsRefs:
    - docs/concepts/qa-e2e-automation.md
  codeRefs:
    - extensions/qa-lab/src/qa-transport.ts
  execution:
    kind: flow
    channel: matrix
    suiteIsolation: isolated
    summary: Exercise normalized restart and continuation delivery.
    config:
      conversationKind: group
      conversationId: "!qa-restart:crabline.test"
      senderId: "@driver:crabline.test"
      mentionPrefix: "@openclaw "
      # The text prefix is not a Matrix user mention. Delivery is under test,
      # not mention gating, and two joined members are not a direct room.
      matrixConfigOverrides:
        groupsByKey:
          main:
            requireMention: false
      firstPrefix: MATRIX_QA_RESTART_BEFORE
      secondPrefix: MATRIX_QA_RESTART_AFTER
      timeoutMs: 60000

flow:
  shared: channel-restart-resume
